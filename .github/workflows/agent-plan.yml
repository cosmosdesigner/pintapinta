name: Agent plan
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: agent-plan-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.event.label.name == 'agent-ready' && github.event.issue.pull_request == null && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Capture triggering issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE" --json number,title,body,labels,author > issue.json
      - uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          prompt-file: .github/codex/prompts/plan.md
          output-file: agent-plan.md
          safety-strategy: unsafe
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Validate plan issue number
        env:
          ISSUE: ${{ github.event.issue.number }}
          PLAN: ${{ steps.codex.outputs.final-message }}
        run: |
          case "$PLAN" in
            *"issue #$ISSUE"*|*"Issue #$ISSUE"*) ;;
            *) echo "::error::Planner output does not reference triggering issue #$ISSUE."; exit 1 ;;
          esac
      - name: Publish plan
        if: always() && steps.codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.codex.outputs.final-message }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body "$PLAN"
