name: Codex review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Check OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::The OPENAI_API_KEY repository secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: openai/codex-action@v1
        id: codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review.md
          safety-strategy: unsafe
      - name: Publish review summary
        if: always() && steps.codex.outputs.final-message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.codex.outputs.final-message }}
          PR: ${{ inputs.pr_number }}
        run: gh pr comment "$PR" --body "$REVIEW"
